// Some plugins (e.g. audioplayers_android) pin old AGP/Kotlin versions in their
// buildscript; align them with the project's versions so Gradle doesn't try to
// download them. Their buildscript only lists google()/mavenCentral(), so the
// mirrors are added too for networks where dl.google.com is unreachable.
subprojects {
    buildscript.repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
    }
    buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            def requested = details.requested
            if (requested.group == 'com.android.tools.build' && requested.name == 'gradle') {
                details.useVersion '9.1.0'
            } else if (requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '2.4.0'
            }
        }
    }
}

// Mirrors come first: Gradle fetches an artifact only from the repository that
// served its POM, so a flaky dl.google.com would otherwise fail the build.
allprojects {
    repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)
subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
