name: rock_paper_scissors
description: A kid-friendly Rock Paper Scissors Flutter game.
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.2
  intl: any
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/hands/
    - assets/sounds/
  fonts:
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-Regular.ttf
          weight: 400
        - asset: assets/fonts/BalooBhaijaan2-Bold.ttf
          weight: 700
        - asset: assets/fonts/BalooBhaijaan2-ExtraBold.ttf
          weight: 800

# Regenerate with: flutter test tool/generate_icon_test.dart
#                  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#2875C9"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#BDEEFF"
    theme_color: "#2875C9"

# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#BDEEFF"
  image: assets/branding/splash.png
  color_dark: "#283553"
  image_dark: assets/branding/splash.png
  android_12:
    color: "#BDEEFF"
    image: assets/branding/icon_foreground.png
    color_dark: "#283553"
    image_dark: assets/branding/icon_foreground.png
  web: false
